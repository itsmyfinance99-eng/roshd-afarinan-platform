# Reverse proxy in front of the platform (used by infra/docker/compose.app.yml).
# Browser API calls go straight to the API; everything else goes to the web app.
# The API runs with TRUST_PROXY=1 and reads the visitor IP from the entry nginx appends.
# In production, terminate TLS here (listen 443 ssl; certificates) and redirect port 80.

# Access log without the query string: it carries mobile numbers (guest tracking), signed
# download signatures and search terms (ST-26.06). $uri is the decoded path only.
log_format roshd '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent "$http_user_agent" $request_time';

upstream roshd_api {
  server api:4000;
}

upstream roshd_web {
  server web:3000;
}

server {
  listen 80;
  server_name _;

  # Uploads are limited to 8 MB by the API; allow a little overhead for multipart framing.
  client_max_body_size 10m;
  server_tokens off;

  access_log /var/log/nginx/access.log roshd;

  # Compress API responses (JSON, CSV exports, sitemaps); the web app compresses its own output.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/json text/csv application/xml text/xml text/plain;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # Appends the real client address; the API trusts exactly this one hop (TRUST_PROXY=1),
  # so a value forged by the client is never used.
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  location /api/ {
    proxy_pass http://roshd_api;
  }

  location / {
    proxy_pass http://roshd_web;
  }
}
