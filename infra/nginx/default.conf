# Reverse proxy in front of the platform (used by infra/docker/compose.app.yml).
# Browser API calls go straight to the API; everything else goes to the web app.
# The API runs with TRUST_PROXY=1 and reads the visitor IP from the entry nginx appends.
# In production, terminate TLS here (listen 443 ssl; certificates) and redirect port 80.

upstream roshd_api {
  server api:4000;
}

upstream roshd_web {
  server web:3000;
}

server {
  listen 80;
  server_name _;

  # Uploads are limited to 8 MB by the API; allow a little overhead for multipart framing.
  client_max_body_size 10m;
  server_tokens off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # Appends the real client address; the API trusts exactly this one hop (TRUST_PROXY=1),
  # so a value forged by the client is never used.
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  location /api/ {
    proxy_pass http://roshd_api;
  }

  location / {
    proxy_pass http://roshd_web;
  }
}
