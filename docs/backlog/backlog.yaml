# Backlog: single source of truth for EPIC → STORY.
# Sync to GitHub (labels, milestones, issues) with:  pnpm backlog:sync   (idempotent)
# Fields:
#   points   : story points (Fibonacci 1,2,3,5,8,13)
#   priority : critical | high | medium | low
#   sprint   : key of a milestone below
#   area     : api | web | db | infra | docs | security | ui | qa

