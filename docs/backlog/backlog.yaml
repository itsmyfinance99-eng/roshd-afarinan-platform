    title: 'LMS Curriculum — سرفصل و محتوای دوره'
    phase: 2
    priority: high
    goal: 'هر دوره سرفصل (بخش و درس) و محتوای درس داشته باشد که کارکنان مدیریت می‌کنند و فقط افراد مجاز به آن دسترسی دارند.'
    stories:
      - id: ST-28.01
        title: 'ADR-0008 و مدل داده LMS: بخش، درس، ثبت‌نام و پیشرفت'
        sprint: S24
        points: 8
        priority: high
        area: [api, db, docs]
        story: 'به‌عنوان معمار می‌خواهم مدل داده و مرز ماژول‌های LMS و تجارت پیش از پیاده‌سازی تثبیت شود تا ماژول‌ها به جدول‌های هم دست نزنند.'
        acceptance:
          - 'ADR-0008 از وضعیت Proposed به Accepted برسد'
          - 'migration برای CourseSection، Lesson (نوع VIDEO/TEXT/FILE، ترتیب، پیش‌نمایش، مدت)، Enrollment (منبع FREE/ORDER/MANUAL، وضعیت، expiresAt خالی‌پذیر) و LessonProgress'
          - 'یکتایی (userId, courseId) برای Enrollment و (enrollmentId, lessonId) برای LessonProgress'
          - 'تابع خالص canAccessLesson با unit test برای پیش‌نمایش، ثبت‌نام فعال، لغوشده، منقضی و کارکنان'
          - 'domain-model.md و system-overview.md به‌روز شوند'
      - id: ST-28.02
        title: 'API مدیریت سرفصل: بخش‌ها و درس‌ها'
        sprint: S24
        points: 5
        priority: high
        area: [api]
        depends: [ST-28.01]
        story: 'به‌عنوان کارشناس محتوا می‌خواهم بخش‌ها و درس‌های دوره را بسازم، مرتب کنم و منتشر کنم.'
        acceptance:
          - 'CRUD و جابه‌جایی ترتیب بخش و درس با مجوز catalog:manage؛ اعتبارسنجی Zod از @roshd/validation'
          - 'درس پیش‌نویس در هیچ API عمومی یا دانشجویی دیده نشود'
          - 'تغییرات در Audit Log ثبت شود'
          - 'تست e2e شامل تست منفی دسترسی (کاربر عادی و دانشجو 403)'
      - id: ST-28.03
        title: 'ویرایشگر سرفصل در پنل مدیریت'
        sprint: S25
        points: 8
        priority: high
        area: [web, ui]
        depends: [ST-28.02]
        story: 'به‌عنوان کارشناس محتوا می‌خواهم سرفصل دوره را در داشبورد ویرایش کنم.'
        acceptance:
          - 'افزودن، ویرایش، حذف و مرتب‌سازی بخش و درس با کیبورد (بدون وابستگی به drag)'
          - 'ویرایش متن درس با همان ویرایشگر Markdown امن CMS'
          - 'حالت‌های loading، empty، error و success؛ روی سطح paper و قابل استفاده در تبلت'
          - 'تست Playwright و axe'
      - id: ST-28.04
        title: 'نمایش سرفصل در صفحه عمومی دوره و درس‌های پیش‌نمایش'
        sprint: S25
        points: 3
        priority: medium
        area: [web]
        depends: [ST-28.02]
        story: 'به‌عنوان بازدیدکننده می‌خواهم پیش از خرید سرفصل دوره و درس‌های رایگان پیش‌نمایش را ببینم.'
        acceptance:
          - 'عنوان بخش‌ها و درس‌ها و مدت هر درس با عدد فارسی؛ نشانه قفل برای درس‌های غیرپیش‌نمایش'
          - 'درس پیش‌نمایش بدون ورود قابل مشاهده باشد'
          - 'JSON-LD نوع Course به‌روز شود (syllabusSections)'
      - id: ST-28.05
        title: 'تحویل امن ویدئو و فایل درس پشت VideoHostingProvider'
        sprint: S25
        points: 8
        priority: high
        area: [api, security]
        depends: [ST-28.01]
        story: 'به‌عنوان مالک دوره می‌خواهم ویدئوی درس فقط برای دانشجوی مجاز و با لینک کوتاه‌مدت پخش شود.'
        acceptance:
          - 'port با نام VideoHostingProvider و adapter اول روی FileStorageProvider (لینک امضاشده و کوتاه‌مدت، پشتیبانی Range)'
          - 'FilePurpose.LESSON_ASSET با سقف حجم جدا و قابل پیکربندی؛ آپلود فقط با catalog:manage'
          - 'هر درخواست پخش از canAccessLesson عبور کند؛ تست منفی IDOR برای دوره دیگر و ثبت‌نام لغوشده'
          - 'انتخاب سرویس VOD واقعی پس از OQ-26 فقط adapter جدید باشد'

