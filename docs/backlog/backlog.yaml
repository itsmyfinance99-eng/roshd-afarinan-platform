  - id: EPIC-30
    title: 'Commerce — تکمیل خرید و پرداخت'
    phase: 2
    priority: high
    goal: 'خرید دوره بدون از دست رفتن یا تکرار به ثبت‌نام برسد، پرداخت‌های نیمه‌کاره تطبیق شوند و رسید و گزارش فروش وجود داشته باشد.'
    stories:
      - id: ST-30.01
        title: 'Fulfillment سفارش با outbox: پرداخت موفق → ثبت‌نام'
        sprint: S24
        points: 8
        priority: critical
        area: [api, db]
        depends: [ST-29.01]
        story: 'به‌عنوان خریدار می‌خواهم بلافاصله پس از پرداخت موفق در دوره ثبت‌نام شوم، حتی اگر سرور وسط کار راه‌اندازی مجدد شود.'
        acceptance:
          - 'جدول OrderFulfillment در همان تراکنش PAID؛ پردازشگر با retry و backoff در زمان‌بند maintenance'
          - 'handler دوره از LearningService.enrollFromOrder؛ اجرای دوباره هیچ ثبت‌نام تکراری نسازد'
          - 'تست: خطای handler، retry موفق، callback تکراری، دو پردازشگر هم‌زمان'
          - 'وضعیت fulfillment در صفحه سفارش کارکنان دیده شود'
      - id: ST-30.02
        title: 'مجموعه تست قرارداد PaymentGateway'
        sprint: S24
        points: 3
        priority: high
        area: [api, qa]
        story: 'به‌عنوان توسعه‌دهنده می‌خواهم هر adapter درگاه (mock امروز، PSP واقعی فردا) با یک مجموعه تست مشترک سنجیده شود.'
        acceptance:
          - 'تست‌های مشترک: مبلغ نامطابق FAILED، verify تکراری امن، timeout در سقف PAYMENT_GATEWAY_TIMEOUT_MS، مرجع تکراری'
          - 'mock adapter فعلی از این مجموعه عبور کند'
      - id: ST-30.03
        title: 'تطبیق پرداخت‌های نیمه‌کاره و انقضای اختیاری سفارش'
        sprint: S26
        points: 5
        priority: high
        area: [api]
        depends: [ST-30.01]
        story: 'به‌عنوان مسئول مالی می‌خواهم پرداختی که callback آن نرسیده دوباره verify شود تا پول کسی بدون ثبت‌نام نماند.'
        acceptance:
          - 'job زمان‌بندی‌شده تلاش‌های INITIATED قدیمی‌تر از مقدار پیکربندی را با PaymentGateway.verify تطبیق دهد'
          - 'انقضای خودکار سفارش پرداخت‌نشده پیاده‌سازی شود ولی به‌طور پیش‌فرض خاموش باشد (OQ-34)'
          - 'نتیجه هر تطبیق در Audit Log؛ تست برای VERIFIED، FAILED و timeout'
      - id: ST-30.04
