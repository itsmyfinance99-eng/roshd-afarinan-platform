# Backlog: single source of truth for EPIC → STORY.
# Sync to GitHub (labels, milestones, issues) with:  pnpm backlog:sync   (idempotent)
# Fields:
#   points   : story points (Fibonacci 1,2,3,5,8,13)
#   priority : critical | high | medium | low
#   sprint   : key of a milestone below
#   area     : api | web | db | infra | docs | security | ui | qa

milestones:
  - key: S0
    title: 'Sprint 0 — Discovery & Architecture'
    due: '2026-10-02'
    description: 'ADRها، معماری، open questions، backlog و حاکمیت مخزن (فاز ۰)'
  - key: S1
    title: 'Sprint 1 — Foundation'
    due: '2026-10-09'
    description: 'Monorepo، CI، Docker، API skeleton، DB، Auth/RBAC skeleton، Adapterها (فاز ۰)'
  - key: S2
    title: 'Sprint 2 — UI Foundation'
    due: '2026-10-16'
    description: 'Layout، RTL، Design Tokens، کامپوننت‌های پایه (فاز ۱)'
  - key: S3
    title: 'Sprint 3 — Public Website'
    due: '2026-10-23'
    description: 'خانه، درباره ما، خدمات، تماس و صفحات مسیرهای اصلی (فاز ۱)'
  - key: S4
    title: 'Sprint 4 — CMS & SEO'
    due: '2026-10-30'
    description: 'صفحات، مقالات، دانشنامه، جست‌وجو و SEO (فاز ۱)'
  - key: S5
    title: 'Sprint 5 — User Core'
    due: '2026-11-06'
    description: 'ورود و ثبت‌نام، پروفایل، داشبورد و فایل (فاز ۱)'
  - key: S6
    title: 'Sprint 6 — Training Catalog & Orders'
    due: '2026-11-13'
    description: 'کاتالوگ آموزش، Order و Payment abstraction (فاز ۱)'
  - key: S7
    title: 'Sprint 7 — Research, Consulting & Tickets'
    due: '2026-11-20'
    description: 'پژوهش، ثبت درخواست خدمات و تیکت (فاز ۱)'
  - key: S8
    title: 'Sprint 8 — Investment Catalog & Release v0.2.0'
    due: '2026-11-27'
    description: 'فرصت‌های سرمایه‌گذاری، skeleton ماژول‌های آینده، QA و انتشار (فاز ۱)'
  - key: P2
    title: 'Phase 2 — LMS & Commerce'
    description: 'LMS پایه، سفارش و پرداخت واقعی'
  - key: P3
    title: 'Phase 3 — Feasibility Platform'
    description: 'پلتفرم امکان‌سنجی'
  - key: P4
    title: 'Phase 4 — Financial Engine'
    description: 'موتور محاسبات مالی'
  - key: P5
    title: 'Phase 5 — Investment Opportunities'
    description: 'فرصت‌های سرمایه‌گذاری (کامل)'
  - key: P6
    title: 'Phase 6 — Iran Sahamdar Integration'
    description: 'اتصال به ایران سهامدار'
  - key: P7
    title: 'Phase 7 — AI Platform'
    description: 'پلتفرم هوش مصنوعی'
  - key: P8
    title: 'Phase 8 — Blockchain / Tokenization'
    description: 'R&D بلاک‌چین و توکن‌سازی'
  - key: P9
    title: 'Phase 9 — PWA / Mobile'
    description: 'PWA، اپلیکیشن موبایل و داشبوردهای پیشرفته'

labels:
  - { name: 'type:epic', color: '5319e7', description: 'Epic' }
  - { name: 'type:story', color: '1d76db', description: 'User story' }
  - { name: 'type:task', color: 'c5def5', description: 'Technical task' }
  - { name: 'type:bug', color: 'd73a4a', description: 'Bug' }
  - { name: 'type:spike', color: 'fbca04', description: 'Research / spike' }
  - { name: 'priority:critical', color: 'b60205', description: 'Must be done now' }
  - { name: 'priority:high', color: 'd93f0b', description: 'High priority' }
  - { name: 'priority:medium', color: 'fbca04', description: 'Medium priority' }
  - { name: 'priority:low', color: '0e8a16', description: 'Low priority' }
  - { name: 'area:api', color: '006b75', description: 'Backend / NestJS' }
  - { name: 'area:web', color: '0052cc', description: 'Frontend / Next.js' }
  - { name: 'area:ui', color: 'bfd4f2', description: 'Design system / UI' }
  - { name: 'area:db', color: '5319e7', description: 'Database / Prisma' }
  - { name: 'area:infra', color: '333333', description: 'CI/CD, Docker, tooling' }
  - { name: 'area:docs', color: '0075ca', description: 'Documentation' }
  - { name: 'area:security', color: 'b60205', description: 'Security' }
  - { name: 'area:qa', color: 'c2e0c6', description: 'Testing / QA' }
  - { name: 'phase:0', color: 'ededed', description: 'Phase 0 — Foundation' }
  - { name: 'phase:1', color: 'ededed', description: 'Phase 1 — MVP' }
  - { name: 'phase:future', color: 'ededed', description: 'Phase 2+' }
  - { name: 'needs:decision', color: 'e99695', description: 'Blocked on a business/legal decision' }
  - { name: 'status:blocked', color: '000000', description: 'Blocked' }

epics:
  # ───────────────────────────── PHASE 0 ─────────────────────────────
  - id: EPIC-01
    title: 'Foundation — زیرساخت پایه'
    phase: 0
    priority: critical
    goal: 'پروژه‌ای قابل اجرا، تست‌پذیر و قابل deploy با معماری ماژولار و قراردادهای استاندارد.'
    stories:
      - id: ST-01.01
        status: done
        title: 'مستندات معماری، ADRها و سؤالات باز'
        sprint: S0
        points: 3
        priority: critical
        area: [docs]
        story: 'به‌عنوان مالک محصول می‌خواهم معماری، تصمیم‌ها و ابهام‌ها مستند باشند تا تیم بدون حدس‌زدن قوانین کسب‌وکار توسعه دهد.'
        acceptance:
          - 'system-overview، domain-model، api conventions و security-baseline نوشته شده باشند'
          - 'ADR-0001 تا ADR-0007 ثبت شده باشند'
          - 'open-questions با حداقل ۱۵ سؤال و اثر هر کدام ثبت شده باشد'
      - id: ST-01.02
        status: done
        title: 'حاکمیت مخزن: backlog، قالب‌های Issue/PR و CONTRIBUTING'
        sprint: S0
        points: 3
        priority: critical
        area: [docs, infra]
        story: 'به‌عنوان عضو تیم می‌خواهم فرآیند شاخه‌بندی، commit، PR و backlog استاندارد باشد تا کار قابل پیگیری و قابل بازبینی باشد.'
        acceptance:
          - 'CLAUDE.md، CONTRIBUTING.md، SECURITY.md و CODEOWNERS وجود داشته باشند'
          - 'قالب‌های Epic، Story، Bug، Task، Spike و PR ساخته شده باشند'
          - 'backlog.yaml با اسکریپت sync به Issues، Labels و Milestones منتقل شود'
      - id: ST-01.03
        status: done
        title: 'Monorepo tooling: pnpm، Turborepo، TypeScript، ESLint، Prettier و commitlint'
        sprint: S1
        points: 5
        priority: critical
        area: [infra]
        story: 'به‌عنوان توسعه‌دهنده می‌خواهم یک monorepo با تنظیمات مشترک داشته باشم تا همه پکیج‌ها یکپارچه lint، typecheck و test شوند.'
        acceptance:
          - 'دستورهای pnpm install و pnpm verify روی clone تمیز کار کنند'
          - 'پکیج‌های tsconfig، eslint-config، types و validation ساخته شده باشند'
          - 'commit با پیام غیر استاندارد توسط commitlint رد شود'
      - id: ST-01.04
        status: done
        title: 'CI روی GitHub Actions و Dependabot'
        sprint: S1
        points: 3
        priority: critical
        area: [infra, qa]
        story: 'به‌عنوان تیم می‌خواهم هر PR به‌صورت خودکار بررسی شود تا کد شکسته وارد develop نشود.'
        acceptance:
          - 'CI روی PR و push به develop و main اجرا شود: lint، typecheck، test و build'
          - 'تست‌های e2e API با سرویس PostgreSQL اجرا شوند'
          - 'Dependabot برای npm و github-actions فعال باشد'
      - id: ST-01.05
        status: done
        title: 'API skeleton: NestJS، config validation و versioning'
        sprint: S1
        points: 5
        priority: critical
        area: [api]
        story: 'به‌عنوان توسعه‌دهنده می‌خواهم API پایه با تنظیمات معتبرسازی‌شده داشته باشم تا ماژول‌ها روی یک پایه یکسان ساخته شوند.'
        acceptance:
          - 'اپلیکیشن با env نامعتبر با پیام روشن متوقف شود'
          - 'همه مسیرها زیر /api/v1 باشند'
          - 'Swagger در /docs در دسترس باشد (در production قابل غیرفعال‌سازی)'
      - id: ST-01.06
        status: done
        title: 'قرارداد API: envelope، مدل خطا، Request ID و Zod validation'
        sprint: S1
        points: 5
        priority: critical
        area: [api]
        story: 'به‌عنوان مصرف‌کننده API می‌خواهم پاسخ‌ها و خطاها ساختار ثابتی داشته باشند تا کلاینت‌ها ساده و قابل اتکا باشند.'
        acceptance:
          - 'پاسخ موفق {data, meta} و خطا {error:{code,message,details,requestId}} باشد'
          - 'خطای validation کد VALIDATION_FAILED با جزئیات فیلد برگرداند'
          - 'X-Request-Id در پاسخ و لاگ‌ها وجود داشته باشد'
          - 'خطاهای ناشناخته جزئیات داخلی را افشا نکنند'
      - id: ST-01.07
        status: done
        title: 'Logging ساخت‌یافته و endpointهای Health/Readiness'
        sprint: S1
        points: 3
        priority: high
        area: [api, infra]
        story: 'به‌عنوان مسئول عملیات می‌خواهم لاگ ساخت‌یافته و health check داشته باشم تا مشکلات سریع تشخیص داده شوند.'
        acceptance:
          - 'لاگ‌ها JSON با requestId باشند و header احراز هویت و cookie را redact کنند'
          - '/api/v1/health/live همیشه 200 و /api/v1/health/ready در صورت قطع DB پاسخ 503 بدهد'
      - id: ST-01.08
        status: done
        title: 'پایگاه داده: Docker Compose، Prisma، migration اولیه و seed'
        sprint: S1
        points: 5
        priority: critical
        area: [db, infra]
        story: 'به‌عنوان توسعه‌دهنده می‌خواهم با یک دستور DB محلی و migrationها را بالا بیاورم تا محیط توسعه تکرارپذیر باشد.'
        acceptance:
          - 'docker compose up پایگاه PostgreSQL و Redis را اجرا کند'
          - 'migration اولیه مدل Identity، RBAC و Audit را بسازد'
          - 'seed نقش‌ها، مجوزها و یک super_admin توسعه (از env) را بسازد'
      - id: ST-01.09
        status: done
        title: 'Portهای Provider: پرداخت، فایل، اعلان و جست‌وجو + Interfaceهای آینده'
        sprint: S1
        points: 5
        priority: high
        area: [api]
        story: 'به‌عنوان معمار می‌خواهم همه وابستگی‌های بیرونی پشت Interface باشند تا به هیچ vendorی قفل نشویم.'
        acceptance:
          - 'PaymentGateway، FileStorageProvider، NotificationProvider و SearchProvider با adapter توسعه تعریف شده باشند'
          - 'Interfaceهای IranSahamdarClient (به‌همراه mock)، AiProvider، BlockchainNetworkAdapter و FinancialCalculator تعریف شده باشند'
          - 'اجرای production با MockPaymentGateway متوقف شود'
      - id: ST-01.10
        title: 'Dockerfile برای api و web و راهنمای اجرای محلی'
        sprint: S1
        points: 3
        priority: medium
        area: [infra, docs]
        story: 'به‌عنوان مسئول استقرار می‌خواهم image قابل اجرا داشته باشم تا deploy تکرارپذیر باشد.'
        acceptance:
          - 'Dockerfile چندمرحله‌ای و non-root برای هر دو اپ'
          - 'README شامل دستورهای راه‌اندازی از صفر باشد'

  - id: EPIC-02
    title: 'Authentication & RBAC — احراز هویت و کنترل دسترسی'
    phase: 0
    priority: critical
    goal: 'یک هویت واحد برای هر شخص با نقش‌های چندگانه و سیاست default-deny.'
    stories:
      - id: ST-02.01
        status: done
        title: 'ثبت‌نام و ورود با ایمیل/رمز عبور (argon2id)'
        sprint: S1
        points: 5
        priority: critical
        area: [api, security]
        story: 'به‌عنوان بازدیدکننده می‌خواهم ثبت‌نام و وارد شوم تا به خدمات شخصی دسترسی داشته باشم.'
        acceptance:
          - 'رمز با argon2id ذخیره شود و هرگز در پاسخ یا لاگ نیاید'
          - 'ایمیل تکراری خطای 409 بدهد'
          - 'ورود ناموفق پیام عمومی بدهد (عدم افشای وجود حساب)'
      - id: ST-02.02
        status: done
        title: 'Access token و Refresh token چرخشی با تشخیص استفاده مجدد'
        sprint: S1
        points: 5
        priority: critical
        area: [api, security]
        story: 'به‌عنوان کاربر می‌خواهم نشست امن و ماندگار داشته باشم و در صورت سرقت توکن، نشست باطل شود.'
        acceptance:
          - 'توکن refresh در هر استفاده چرخش کند و فقط hash آن ذخیره شود'
          - 'استفاده مجدد از توکن باطل، کل خانواده نشست را باطل کند'
          - 'logout نشست جاری را باطل کند'
      - id: ST-02.03
        status: done
        title: 'RBAC: نقش‌ها، مجوزها، Guard سراسری default-deny'
        sprint: S1
        points: 5
        priority: critical
        area: [api, security]
        story: 'به‌عنوان مدیر سیستم می‌خواهم دسترسی‌ها مبتنی بر نقش و مجوز باشد تا هر کاربر فقط کار مجاز انجام دهد.'
        acceptance:
          - 'همه مسیرها به‌جز @Public() احراز هویت لازم داشته باشند'
          - '@Permissions() بدون مجوز لازم 403 برگرداند'
          - 'تست منفی: کاربر عادی نتواند نقش تغییر دهد'
      - id: ST-02.04
        status: done
        title: 'Audit Log برای رویدادهای امنیتی'
        sprint: S1
        points: 3
        priority: high
        area: [api, security]
        story: 'به‌عنوان مسئول امنیت می‌خواهم رویدادهای حساس ثبت شوند تا قابل پیگیری باشند.'
        acceptance:
          - 'ورود موفق و ناموفق، خروج، استفاده مجدد توکن و تغییر نقش ثبت شوند'
          - 'IP، user agent و requestId ذخیره شوند'
      - id: ST-02.05
        status: done
        title: 'Rate limiting و محافظت brute-force'
        sprint: S1
        points: 2
        priority: high
        area: [api, security]
        story: 'به‌عنوان مسئول امنیت می‌خواهم تلاش‌های مکرر محدود شوند تا حملات brute-force بی‌اثر شوند.'
        acceptance:
          - 'مسیرهای auth محدودیت سخت‌گیرانه داشته باشند و 429 با کد RATE_LIMITED برگردانند'
      - id: ST-02.06
        status: done
        title: 'مدیریت نقش کاربران توسط ادمین'
        sprint: S5
        points: 3
        priority: medium
        area: [api, security]
        story: 'به‌عنوان ادمین می‌خواهم نقش کاربران را مدیریت کنم تا دسترسی‌ها کنترل شوند.'
        acceptance:
          - 'فقط admin/super_admin نقش تخصیص دهند؛ فقط super_admin نقش admin بدهد'
          - 'هر تغییر نقش در Audit Log ثبت شود'

  # ───────────────────────────── PHASE 1 ─────────────────────────────
  - id: EPIC-03
    title: 'CMS — مدیریت محتوا'
    phase: 1
    priority: high
    goal: 'مدیریت صفحات، مقالات، دسته‌ها، نویسندگان و SEO به‌عنوان بخشی از مدل داده.'
    stories:
      - id: ST-03.01
        title: 'مدل محتوا: Article، Category، Tag، Author با فیلدهای SEO'
        sprint: S4
        points: 5
        priority: high
        area: [api, db]
        story: 'به‌عنوان ویراستار می‌خواهم مقاله با دسته، برچسب، نویسنده و SEO ثبت کنم تا محتوای قابل ایندکس منتشر شود.'
        acceptance:
          - 'slug یکتا، وضعیت DRAFT/PUBLISHED/ARCHIVED، metaTitle، metaDescription، canonical و noIndex'
          - 'migration و seed نمونه (با برچسب نمایشی)'
      - id: ST-03.02
        title: 'API مدیریت محتوا با مجوز editor و انتشار'
        sprint: S4
        points: 5
        priority: high
        area: [api, security]
        story: 'به‌عنوان ویراستار می‌خواهم محتوا را ایجاد، ویرایش و منتشر کنم.'
        acceptance:
          - 'فقط نقش‌های دارای cms.* مجاز باشند (تست منفی)'
          - 'انتشار و آرشیو در Audit Log ثبت شود'
      - id: ST-03.03
        title: 'API عمومی خواندن محتوا (فقط منتشرشده) با صفحه‌بندی'
        sprint: S4
        points: 3
        priority: high
        area: [api]
        story: 'به‌عنوان بازدیدکننده می‌خواهم فقط محتوای منتشرشده را ببینم.'
        acceptance:
          - 'پیش‌نویس از API عمومی 404 برگرداند'
          - 'فیلتر بر اساس دسته و صفحه‌بندی'
      - id: ST-03.04
        title: 'صفحات Page ساخت‌یافته (sections) برای محتوای سازمانی'
        sprint: S4
        points: 3
        priority: medium
        area: [api, web]
        story: 'به‌عنوان ویراستار می‌خواهم متن صفحات سازمانی را بدون deploy تغییر دهم.'
        acceptance:
          - 'مدل Page با sections و SEO'
          - 'صفحه درباره ما از Page خوانده شود و fallback به content layer داشته باشد'

  - id: EPIC-04
    title: 'Public Website — وب‌سایت عمومی'
    phase: 1
    priority: critical
    goal: 'سایت عمومی RTL، Responsive، اعتمادساز و با چهار مسیر اصلی.'
    stories:
      - id: ST-04.01
        status: done
        title: 'پایه وب: Next.js، RTL، فونت Vazirmatn و Design Tokens'
        sprint: S2
        points: 5
        priority: critical
        area: [web, ui]
        story: 'به‌عنوان کاربر فارسی‌زبان می‌خواهم سایت کاملاً راست‌چین با تایپوگرافی درست باشد.'
        acceptance:
          - 'html با lang=fa و dir=rtl؛ فونت self-hosted'
          - 'رنگ‌ها و فاصله‌ها فقط از tokens'
          - 'پکیج @roshd/ui با Button، Card، Container، Badge، Input و ... و تست'
      - id: ST-04.02
        status: done
        title: 'Layout: Header، ناوبری dropdown، منوی موبایل، Footer'
        sprint: S2
        points: 5
        priority: critical
        area: [web, ui]
        story: 'به‌عنوان بازدیدکننده می‌خواهم در همه دستگاه‌ها به‌راحتی بین بخش‌ها جابه‌جا شوم.'
        acceptance:
          - 'منوی موبایل با کیبورد و screen reader قابل استفاده باشد'
          - 'skip link و focus visible'
      - id: ST-04.07
        status: done
        title: 'ثبت UI اولیه Claude Design (Home.dc.html، mock-data.js، support.js) در مخزن'
        sprint: S2
        points: 5
        priority: critical
        area: [web, ui]
        story: 'به‌عنوان مالک محصول می‌خواهم UI اولیه‌ای که در Claude Design طراحی شده در مخزن ثبت و به کامپوننت‌های Next.js تبدیل شود تا بعداً طبق تغییرات Backend به‌روز شود.'
        acceptance:
          - 'فایل‌های خام طراحی در design/claude-design/ نسخه‌بندی شوند (منبع: پروژه 5c1ac6ab-902c-4365-8c80-3d445afff738)'
          - 'tokens طراحی (رنگ، تایپوگرافی، فاصله) به @roshd/ui منتقل شوند'
          - 'mock-data به content layer / repositoryهای typed منتقل شود؛ business logic در کامپوننت‌های بصری نباشد'
          - 'نقشه integration: route mapping، component reuse و تعارض‌ها مستند شود'
      - id: ST-04.03
        status: done
        title: 'صفحه اصلی با Hero و چهار مسیر اصلی'
        sprint: S3
        points: 8
