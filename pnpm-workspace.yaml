packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install scripts (pnpm blocks all others by default)
allowBuilds:
  '@swc/core': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  unrs-resolver: true
  '@scarf/scarf': false # telemetry

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - turbo@2.11.4
  - nestjs-pino@5.2.1

# Security overrides for transitive dependencies of the Prisma CLI (ST-25.10, `pnpm audit`).
# Remove each one once prisma depends on a patched version itself.
overrides:
  mysql2: '>=3.23.1' # GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3 (MySQL driver; we use PostgreSQL)
  deepmerge-ts: '>=8.0.0' # stack exhaustion on deeply nested input
