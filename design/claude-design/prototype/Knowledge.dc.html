<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>دانشنامه — رشدآفرینان صنعت و معدن (نمونه v2 · مس و گرافیت)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..900&amp;family=Noto+Kufi+Arabic:wght@600..800&amp;display=swap">
  <script src="mock-data.js"></script>
  <script>window.RoshdForceMotion = true;</script>
  <script src="motion.js"></script>
  <style>html,body{margin:0;background:#111418;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl}*{box-sizing:border-box}a{color:#E7B386}a:hover{color:#EDEFF2}:focus-visible{outline:3px solid #D08A4E;outline-offset:2px}</style>
</helmet>
<div dir="rtl" lang="fa-IR" data-auto-reveal="" style="font-family:Vazirmatn,Tahoma,sans-serif;color:#EDEFF2;background:#111418;min-height:100vh">
  <dc-import name="SiteHeader" active="knowledge" hint-size="100%,116px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <main>
    <dc-import name="PageHero" crumb="دانشنامه" eyebrow="دانشنامه" title="مفاهیم کلیدی سرمایه‌گذاری، امکان‌سنجی و تأمین مالی" lead="مدخل‌های کوتاه و قابل‌جستجو برای آشنایی با اصطلاحات تخصصی." hint-size="100%,340px"></dc-import>
    <section style="max-width:960px;margin:0 auto;padding:48px 24px 80px">
      <label for="kq" style="display:block;font-size:14px;font-weight:700;color:#EDEFF2;margin-bottom:8px">جستجو در دانشنامه</label>
      <input id="kq" value="{{ q }}" onChange="{{ onQ }}" placeholder="مثلاً: طرح توجیهی" style="width:100%;height:54px;border:1px solid #3A4250;border-radius:6px;padding:0 16px;font:400 16px Vazirmatn,sans-serif">
      <div role="group" aria-label="دسته" style="display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 28px">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{ c.on }}" onClick="{{ c.pick }}" style="height:36px;padding:0 12px;border-radius:4px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font:600 13px Vazirmatn,sans-serif;cursor:pointer">{{ c.label }}</button>
        </sc-for>
      </div>
      <sc-if value="{{ showEmpty }}">
        <div role="status" style="padding:48px 24px;text-align:center;border:1px dashed #3A4250;border-radius:8px">
          <p style="margin:0 0 8px;font-size:18px;font-weight:700">مدخلی یافت نشد</p>
          <p style="margin:0;font-size:14px;color:#C3C9D2">عبارت دیگری را جستجو کنید.</p>
        </div>
      </sc-if>
      <ul style="list-style:none;margin:0;padding:0;border-top:1px solid #2A313B">
        <sc-for list="{{ items }}" as="k" hint-placeholder-count="6">
          <li style="border-bottom:1px solid #2A313B">
            <a href="#" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:20px 0;text-decoration:none;color:#EDEFF2" style-hover="background:#1A1F26">
              <span style="font-size:18px;font-weight:900;color:#EDEFF2">{{ k.title }}</span>
              <span style="font-size:13px;color:#E7B386;font-weight:700">{{ k.category }}</span>
              <span style="font-size:14px;line-height:1.9;color:#C3C9D2">{{ k.summary }}</span>
              <time style="font-size:13px;color:#9AA3AF">{{ k.date }}</time>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,640px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cat: 'همه', q: '' };
  componentDidMount() { if (!window.RoshdData) this.poll = setInterval(() => { if (window.RoshdData) { clearInterval(this.poll); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this.poll); }
  renderVals() {
    const D = window.RoshdData || { knowledge: [] };
    const { cat, q } = this.state; const qq = q.trim();
    const cats = ['همه', ...Array.from(new Set(D.knowledge.map(c => c.category)))];
    const items = D.knowledge.filter(k => (cat === 'همه' || k.category === cat) && (!qq || k.title.includes(qq) || k.summary.includes(qq)));
    return {
      q, onQ: e => this.setState({ q: e.target.value }),
      chips: cats.map(l => { const on = l === cat; return { label: l, on, bg: on ? '#D08A4E' : '#1A1F26', fg: on ? '#111418' : '#C3C9D2', border: on ? '#D08A4E' : '#3A4250', pick: () => this.setState({ cat: l }) }; }),
      items, showEmpty: items.length === 0,
    };
  }
}
</script>
</body>
</html>
