<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article data-spotlight="" style="position:relative;overflow:hidden;background:#1A1F26;border:1px solid #2A313B;border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:10px;height:100%;box-sizing:border-box;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl;transition:transform 200ms cubic-bezier(0.22,1,0.36,1),border-color 200ms,box-shadow 200ms" style-hover="transform:translateY(-2px);border-color:#D08A4E;box-shadow:0 16px 36px -24px rgba(208,138,78,0.45)">
  <span data-spot="" aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(208,138,78,0.08),transparent 60%)"></span>
  <div style="position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px">
    <span style="font-weight:700;color:#E7B386">{{ item.category }}</span>
    <span style="display:flex;align-items:center;gap:8px">
      <span style="background:#1E1712;color:#E7B386;border:1px dashed #5A3E27;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap">نمونه نمایشی</span>
      <time style="color:#9AA3AF">{{ item.date }}</time>
    </span>
  </div>
  <h3 style="font-family:'Noto Kufi Arabic',Vazirmatn,sans-serif;position:relative;margin:0;font-size:17px;line-height:1.7;color:#EDEFF2;text-wrap:pretty">{{ item.title }}</h3>
  <p style="position:relative;margin:0;font-size:14px;line-height:1.9;color:#C3C9D2;text-wrap:pretty">{{ item.summary }}</p>
  <a href="{{ href }}" style="position:relative;margin-top:auto;padding-top:6px;font-size:14px;font-weight:700;color:#E7B386;text-decoration:none" style-hover="color:#EDEFF2">{{ cta }} ‹</a>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;360px&quot;,&quot;height&quot;:&quot;240px&quot;},&quot;item&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;title&quot;:&quot;عنوان نمونه&quot;,&quot;summary&quot;:&quot;خلاصه کوتاه&quot;,&quot;category&quot;:&quot;دسته&quot;,&quot;date&quot;:&quot;۱۴۰۵/۰۶/۰۱&quot;},&quot;tsType&quot;:&quot;Entry&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;مطالعه&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { href: this.props.href || '#', cta: this.props.cta || 'مطالعه' }; }
}
</script>
</body>
</html>
