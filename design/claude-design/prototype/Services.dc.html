<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>مشاوره — رشدآفرینان صنعت و معدن (نمونه v2 · مس و گرافیت)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..900&amp;family=Noto+Kufi+Arabic:wght@600..800&amp;display=swap">
  <script src="mock-data.js"></script>
  <script>window.RoshdForceMotion = true;</script>
  <script src="motion.js"></script>
  <style>html,body{margin:0;background:#111418;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl}*{box-sizing:border-box}a{color:#E7B386}a:hover{color:#EDEFF2}:focus-visible{outline:3px solid #D08A4E;outline-offset:2px}</style>
</helmet>
<div dir="rtl" lang="fa-IR" data-auto-reveal="" style="font-family:Vazirmatn,Tahoma,sans-serif;color:#EDEFF2;background:#111418;min-height:100vh">
  <dc-import name="SiteHeader" active="services" hint-size="100%,116px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <main>
    <dc-import name="PageHero" crumb="مشاوره" eyebrow="خدمات مشاوره" title="مشاوره تخصصی در سرمایه‌گذاری، تأمین مالی، اقتصاد و پروژه" lead="همراهی کارشناسی از مرحله ایده تا تصمیم سرمایه‌گذاری." hint-size="100%,340px"></dc-import>
    <section style="max-width:1280px;margin:0 auto;padding:72px 24px">
      <sc-for list="{{ services }}" as="s" hint-placeholder-count="6">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px 40px;padding:32px 0;border-bottom:1px solid #2A313B;align-items:center">
          <div style="display:flex;gap:18px;align-items:baseline"><span style="font-size:14px;color:#D08A4E;font-weight:700">{{ s.n }}</span><h2 style="font-family:'Noto Kufi Arabic',Vazirmatn,sans-serif;margin:0;font-size:24px;font-weight:800;color:#EDEFF2">{{ s.title }}</h2></div>
          <p style="margin:0;font-size:16px;line-height:2;color:#C3C9D2">{{ s.desc }}</p>
          <a href="Contact.dc.html" style="justify-self:end;font-size:15px;font-weight:700;text-decoration:none">درخواست این خدمت ‹</a>
        </div>
      </sc-for>
    </section>
    <section aria-labelledby="faq-s" style="background:#15191F;border-top:1px solid #2A313B">
      <div style="max-width:880px;margin:0 auto;padding:72px 24px">
        <h2 id="faq-s" style="font-family:'Noto Kufi Arabic',Vazirmatn,sans-serif;margin:0 0 24px;font-size:clamp(24px,2.8vw,32px);font-weight:800;color:#EDEFF2">پرسش‌های متداول</h2>
        <div data-stagger="60" style="display:flex;flex-direction:column;gap:10px">
          <sc-for list="{{ faq }}" as="q" hint-placeholder-count="4">
            <div data-reveal="" style="border:1px solid {{ q.bd }};border-radius:10px;background:{{ q.bg }};transition:border-color 250ms,background 250ms">
              <h3 style="font-family:'Noto Kufi Arabic',Vazirmatn,sans-serif;margin:0"><button type="button" id="{{ q.bid }}" aria-expanded="{{ q.open }}" aria-controls="{{ q.pid }}" onClick="{{ q.toggle }}" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;background:none;border:none;font:700 16px Vazirmatn,sans-serif;color:#EDEFF2;text-align:right;cursor:pointer">{{ q.q }}<span aria-hidden="true" style="flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#232A33;color:#E7B386;display:flex;align-items:center;justify-content:center;font-size:18px;transform:{{ q.rot }};transition:transform 300ms cubic-bezier(0.65,0,0.35,1)">+</span></button></h3>
              <sc-if value="{{ q.open }}"><div id="{{ q.pid }}" role="region" aria-labelledby="{{ q.bid }}" data-reveal="" data-dur="300" style="padding:0 20px 20px;font-size:15px;line-height:2;color:#C3C9D2">{{ q.a }}</div></sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </section>
    <section style="max-width:1280px;margin:0 auto;padding:72px 24px">
      <div style="background:linear-gradient(155deg,#1E1712,#241A12 60%,#2A1D12);border-radius:20px;box-shadow:0 30px 60px -40px rgba(0,0,0,0.6);padding:clamp(32px,6vw,72px);display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center">
        <h2 style="font-family:'Noto Kufi Arabic',Vazirmatn,sans-serif;margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:800;color:#EDEFF2">برای انتخاب خدمت مناسب با ما گفتگو کنید.</h2>
        <a href="Contact.dc.html" style="white-space:nowrap;flex-shrink:0;height:52px;padding:0 26px;display:flex;align-items:center;background:#D08A4E;color:#111418;border-radius:6px;font-weight:800;text-decoration:none">درخواست مشاوره</a>
      </div>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,640px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: 0 };
  componentDidMount() { if (!window.RoshdData) this.poll = setInterval(() => { if (window.RoshdData) { clearInterval(this.poll); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this.poll); }
  renderVals() {
    const D = window.RoshdData || { services: [], faq: [] };
    const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const open = this.state.open;
    return {
      services: D.services.map((s, i) => ({ ...s, n: fa(String(i + 1)) })),
      faq: D.faq.map((q, i) => ({ ...q, bid: 'sq-b' + i, pid: 'sq-p' + i, open: open === i, rot: open === i ? 'rotate(45deg)' : 'rotate(0)', bd: open === i ? '#D08A4E' : '#2A313B', bg: open === i ? '#1E1712' : '#1A1F26', toggle: () => this.setState({ open: open === i ? -1 : i }) })),
    };
  }
}
</script>
</body>
</html>
