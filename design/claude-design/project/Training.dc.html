<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>آموزش — رشدآفرینان صنعت و معدن (نمونه)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&amp;display=swap">
  <script src="mock-data.js"></script>
  <style>html,body{margin:0;background:#FFFFFF;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl}*{box-sizing:border-box}a{color:#1450C8}a:hover{color:#0B2257}:focus-visible{outline:3px solid #0BA5E0;outline-offset:2px}</style>
</helmet>
<div dir="rtl" lang="fa-IR" style="font-family:Vazirmatn,Tahoma,sans-serif;color:#0E1A33;min-height:100vh">
  <dc-import name="SiteHeader" active="training" hint-size="100%,112px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <main>
    <dc-import name="PageHero" crumb="آموزش" eyebrow="آموزش" title="آموزش تخصصی سرمایه‌گذاری، اقتصاد، امکان‌سنجی و تأمین مالی" lead="دوره‌های این صفحه نمونه نمایشی هستند و برای بررسی ساختار کاتالوگ آموزشی قرار گرفته‌اند." hint-size="100%,340px"></dc-import>
    <section style="max-width:1280px;margin:0 auto;padding:48px 24px 80px">
      <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;margin-bottom:28px">
        <div role="group" aria-label="دسته‌بندی دوره‌ها" style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
            <button type="button" aria-pressed="{{ c.on }}" onClick="{{ c.pick }}" style="height:40px;padding:0 14px;border-radius:4px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font:600 14px Vazirmatn,sans-serif;cursor:pointer">{{ c.label }}</button>
          </sc-for>
        </div>
        <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#1B2740;cursor:pointer"><input type="checkbox" checked="{{ freeOnly }}" onChange="{{ toggleFree }}" style="width:18px;height:18px;accent-color:#1450C8">فقط دوره‌های رایگان</label>
      </div>
      <sc-if value="{{ showEmpty }}">
        <div role="status" style="padding:56px 24px;text-align:center;border:1px dashed #C9D2E3;border-radius:8px">
          <p style="margin:0 0 8px;font-size:18px;font-weight:700">دوره‌ای در این دسته وجود ندارد</p>
          <p style="margin:0;font-size:14px;color:#4A5670">دسته دیگری را انتخاب کنید.</p>
        </div>
      </sc-if>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:20px">
        <sc-for list="{{ courses }}" as="c" hint-placeholder-count="6"><dc-import name="CourseCard" course="{{ c }}" hint-size="100%,400px"></dc-import></sc-for>
      </div>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cat: 'همه', freeOnly: false };
  componentDidMount() { if (!window.RoshdData) this.poll = setInterval(() => { if (window.RoshdData) { clearInterval(this.poll); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this.poll); }
  renderVals() {
    const D = window.RoshdData || { courses: [] };
    const { cat, freeOnly } = this.state;
    const cats = ['همه', ...Array.from(new Set(D.courses.map(c => c.category)))];
    const courses = D.courses.filter(c => (cat === 'همه' || c.category === cat) && (!freeOnly || c.free));
    return {
      chips: cats.map(l => { const on = l === cat; return { label: l, on, bg: on ? '#0B2257' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B2740', border: on ? '#0B2257' : '#C9D2E3', pick: () => this.setState({ cat: l }) }; }),
      freeOnly, toggleFree: () => this.setState({ freeOnly: !freeOnly }), courses, showEmpty: courses.length === 0,
    };
  }
}
</script>
</body>
</html>
