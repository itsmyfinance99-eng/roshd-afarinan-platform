<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>مقالات — رشدآفرینان صنعت و معدن (نمونه)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&amp;display=swap">
  <script src="mock-data.js"></script>
  <style>html,body{margin:0;background:#FFFFFF;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl}*{box-sizing:border-box}a{color:#1450C8}a:hover{color:#0B2257}:focus-visible{outline:3px solid #0BA5E0;outline-offset:2px}</style>
</helmet>
<div dir="rtl" lang="fa-IR" style="font-family:Vazirmatn,Tahoma,sans-serif;color:#0E1A33;min-height:100vh">
  <dc-import name="SiteHeader" active="articles" hint-size="100%,112px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <main>
    <dc-import name="PageHero" crumb="مقالات" eyebrow="مقالات" title="مقالات و یادداشت‌های تخصصی" lead="مقالات فعلی نمونه نمایشی هستند." hint-size="100%,300px"></dc-import>
    <section style="max-width:1280px;margin:0 auto;padding:48px 24px 80px">
      <div role="group" aria-label="دسته مقالات" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{ c.on }}" onClick="{{ c.pick }}" style="height:40px;padding:0 14px;border-radius:4px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font:600 14px Vazirmatn,sans-serif;cursor:pointer">{{ c.label }}</button>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px">
        <sc-for list="{{ items }}" as="a" hint-placeholder-count="6">
          <div style="display:flex;flex-direction:column;gap:0;border-radius:8px;overflow:hidden;border:1px solid #E3E7EF">
            <div role="img" aria-label="جای تصویر مقاله" style="aspect-ratio:16/9;background:repeating-linear-gradient(135deg,#EEF2F8 0 10px,#E5EBF4 10px 20px);display:flex;align-items:center;justify-content:center"><span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#5B667D">تصویر مقاله</span></div>
            <dc-import name="ContentCard" item="{{ a }}" cta="ادامه مطلب" href="#" hint-size="100%,200px" style="display:block;margin:-1px"></dc-import>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cat: 'همه' };
  componentDidMount() { if (!window.RoshdData) this.poll = setInterval(() => { if (window.RoshdData) { clearInterval(this.poll); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this.poll); }
  renderVals() {
    const D = window.RoshdData || { articles: [] };
    const cat = this.state.cat;
    const cats = ['همه', ...Array.from(new Set(D.articles.map(c => c.category)))];
    return {
      chips: cats.map(l => { const on = l === cat; return { label: l, on, bg: on ? '#0B2257' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B2740', border: on ? '#0B2257' : '#C9D2E3', pick: () => this.setState({ cat: l }) }; }),
      items: D.articles.filter(a => cat === 'همه' || a.category === cat),
    };
  }
}
</script>
</body>
</html>
