<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>تماس با ما — رشدآفرینان صنعت و معدن (نمونه)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&amp;display=swap">
  <script src="mock-data.js"></script>
  <style>html,body{margin:0;background:#FFFFFF;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl}*{box-sizing:border-box}a{color:#1450C8}a:hover{color:#0B2257}:focus-visible{outline:3px solid #0BA5E0;outline-offset:2px}</style>
</helmet>
<div dir="rtl" lang="fa-IR" style="font-family:Vazirmatn,Tahoma,sans-serif;color:#0E1A33;min-height:100vh">
  <dc-import name="SiteHeader" active="contact" hint-size="100%,112px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <main>
    <dc-import name="PageHero" crumb="تماس با ما" eyebrow="تماس با ما" title="درخواست مشاوره و ارتباط با کارشناسان" lead="پیام خود را ثبت کنید؛ کارشناسان برای هماهنگی با شما تماس می‌گیرند." hint-size="100%,320px"></dc-import>
    <section style="max-width:1280px;margin:0 auto;padding:64px 24px 80px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:40px;align-items:start">
      <div style="border:1px solid #DDE3EE;border-radius:10px;padding:clamp(20px,3vw,32px)">
        <h2 style="margin:0 0 20px;font-size:22px;font-weight:800;color:#0B2257">فرم تماس</h2>
        <sc-if value="{{ sent }}">
          <div role="status" style="padding:16px;border-radius:6px;background:#EAF6EF;color:#155B34;font-size:15px">پیام نمونه ثبت شد. (در این نسخه ارسالی انجام نمی‌شود.)</div>
        </sc-if>
        <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
          <form onSubmit="{{ submit }}" novalidate="" style="display:flex;flex-direction:column;gap:16px">
            <sc-for list="{{ fields }}" as="f" hint-placeholder-count="4">
              <div style="display:flex;flex-direction:column;gap:6px">
                <label for="{{ f.id }}" style="font-size:14px;font-weight:600;color:#1B2740">{{ f.label }}</label>
                <sc-if value="{{ f.isInput }}"><input id="{{ f.id }}" value="{{ f.value }}" onChange="{{ f.onChange }}" dir="{{ f.dir }}" aria-invalid="{{ f.invalid }}" style="height:46px;border:1px solid {{ f.border }};border-radius:6px;padding:0 12px;font:400 15px Vazirmatn,sans-serif;text-align:right"></sc-if>
                <sc-if value="{{ f.isArea }}"><textarea id="{{ f.id }}" value="{{ f.value }}" onChange="{{ f.onChange }}" aria-invalid="{{ f.invalid }}" rows="5" style="border:1px solid {{ f.border }};border-radius:6px;padding:10px 12px;font:400 15px Vazirmatn,sans-serif;resize:vertical"></textarea></sc-if>
                <sc-if value="{{ f.err }}"><span role="alert" style="font-size:13px;color:#B42318">{{ f.err }}</span></sc-if>
              </div>
            </sc-for>
            <button type="submit" style="height:50px;border:none;border-radius:6px;background:#1450C8;color:#FFFFFF;font:700 15px Vazirmatn,sans-serif;cursor:pointer" style-hover="background:#0F3E9E">ارسال پیام</button>
          </form>
        </sc-if>
      </div>
      <div style="display:flex;flex-direction:column;gap:20px">
        <dl style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:14px 20px;font-size:15px;padding:24px;background:#F3F6FA;border-radius:8px">
          <dt style="color:#5B667D">نشانی</dt><dd style="margin:0">[نمونه] نشانی دفتر مرکزی</dd>
          <dt style="color:#5B667D">تلفن</dt><dd style="margin:0">[نمونه] ۰۲۱-۰۰۰۰۰۰۰۰</dd>
          <dt style="color:#5B667D">ایمیل</dt><dd style="margin:0">[نمونه] info@example.ir</dd>
          <dt style="color:#5B667D">ساعات کاری</dt><dd style="margin:0">[نمونه] شنبه تا چهارشنبه</dd>
        </dl>
        <div role="img" aria-label="جای نقشه موقعیت دفتر" style="aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#EEF2F8 0 10px,#E5EBF4 10px 20px);border-radius:8px;display:flex;align-items:center;justify-content:center"><span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#5B667D">نقشه موقعیت دفتر</span></div>
      </div>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { v: { name: '', phone: '', subject: '', msg: '' }, errors: {}, tried: false, sent: false };
  validate(v) {
    const e = {};
    if (v.name.trim().length < 3) e.name = 'نام را وارد کنید.';
    const p = v.phone.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
    if (!/^09\d{9}$/.test(p)) e.phone = 'شماره موبایل معتبر نیست.';
    if (v.msg.trim().length < 10) e.msg = 'متن پیام را کامل‌تر بنویسید.';
    return e;
  }
  set(k, val) { const v = { ...this.state.v, [k]: val }; this.setState({ v, errors: this.state.tried ? this.validate(v) : {} }); }
  submit = (ev) => { ev.preventDefault(); const errors = this.validate(this.state.v); this.setState({ errors, tried: true, sent: !Object.keys(errors).length }); };
  renderVals() {
    const { v, errors, sent } = this.state;
    const defs = [{ k: 'name', label: 'نام و نام خانوادگی *' }, { k: 'phone', label: 'شماره موبایل *', dir: 'ltr' }, { k: 'subject', label: 'موضوع' }, { k: 'msg', label: 'متن پیام *', area: true }];
    return {
      sent, notSent: !sent, submit: this.submit,
      fields: defs.map(d => ({ id: 'c-' + d.k, label: d.label, dir: d.dir || 'rtl', isInput: !d.area, isArea: !!d.area, value: v[d.k], onChange: e => this.set(d.k, e.target.value), err: errors[d.k] || '', invalid: !!errors[d.k], border: errors[d.k] ? '#B42318' : '#C9D2E3' })),
    };
  }
}
</script>
</body>
</html>
