<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>مشاوره — رشدآفرینان صنعت و معدن (نمونه)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&amp;display=swap">
  <script src="mock-data.js"></script>
  <style>html,body{margin:0;background:#FFFFFF;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl}*{box-sizing:border-box}a{color:#1450C8}a:hover{color:#0B2257}:focus-visible{outline:3px solid #0BA5E0;outline-offset:2px}</style>
</helmet>
<div dir="rtl" lang="fa-IR" style="font-family:Vazirmatn,Tahoma,sans-serif;color:#0E1A33;min-height:100vh">
  <dc-import name="SiteHeader" active="services" hint-size="100%,112px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <main>
    <dc-import name="PageHero" crumb="مشاوره" eyebrow="خدمات مشاوره" title="مشاوره تخصصی در سرمایه‌گذاری، تأمین مالی، اقتصاد و پروژه" lead="همراهی کارشناسی از مرحله ایده تا تصمیم سرمایه‌گذاری." hint-size="100%,340px"></dc-import>
    <section style="max-width:1280px;margin:0 auto;padding:72px 24px">
      <sc-for list="{{ services }}" as="s" hint-placeholder-count="6">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px 40px;padding:32px 0;border-bottom:1px solid #DDE3EE;align-items:center">
          <div style="display:flex;gap:18px;align-items:baseline"><span style="font-size:14px;color:#0BA5E0;font-weight:700">{{ s.n }}</span><h2 style="margin:0;font-size:24px;font-weight:800;color:#0B2257">{{ s.title }}</h2></div>
          <p style="margin:0;font-size:16px;line-height:2;color:#3A4660">{{ s.desc }}</p>
          <a href="Contact.dc.html" style="justify-self:end;font-size:15px;font-weight:700;text-decoration:none">درخواست این خدمت ‹</a>
        </div>
      </sc-for>
    </section>
    <section aria-labelledby="faq-s" style="background:#F3F6FA;border-top:1px solid #E3E7EF">
      <div style="max-width:880px;margin:0 auto;padding:72px 24px">
        <h2 id="faq-s" style="margin:0 0 24px;font-size:clamp(24px,2.8vw,32px);font-weight:800;color:#0B2257">پرسش‌های متداول</h2>
        <div style="border-top:1px solid #D5DCE8">
          <sc-for list="{{ faq }}" as="q" hint-placeholder-count="4">
            <div style="border-bottom:1px solid #D5DCE8">
              <h3 style="margin:0"><button type="button" id="{{ q.bid }}" aria-expanded="{{ q.open }}" aria-controls="{{ q.pid }}" onClick="{{ q.toggle }}" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;background:none;border:none;font:700 16px Vazirmatn,sans-serif;color:#0E1A33;text-align:right;cursor:pointer">{{ q.q }}<span aria-hidden="true" style="font-size:22px;color:#1450C8">{{ q.icon }}</span></button></h3>
              <sc-if value="{{ q.open }}"><div id="{{ q.pid }}" role="region" aria-labelledby="{{ q.bid }}" style="padding:0 0 20px;font-size:15px;line-height:2;color:#3A4660">{{ q.a }}</div></sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </section>
    <section style="max-width:1280px;margin:0 auto;padding:72px 24px">
      <div style="background:#0B2257;border-radius:10px;padding:clamp(28px,5vw,56px);display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center">
        <h2 style="margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:800;color:#FFFFFF">برای انتخاب خدمت مناسب با ما گفتگو کنید.</h2>
        <a href="Contact.dc.html" style="white-space:nowrap;flex-shrink:0;height:52px;padding:0 26px;display:flex;align-items:center;background:#FFFFFF;color:#0B2257;border-radius:6px;font-weight:800;text-decoration:none">درخواست مشاوره</a>
      </div>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: 0 };
  componentDidMount() { if (!window.RoshdData) this.poll = setInterval(() => { if (window.RoshdData) { clearInterval(this.poll); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this.poll); }
  renderVals() {
    const D = window.RoshdData || { services: [], faq: [] };
    const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const open = this.state.open;
    return {
      services: D.services.map((s, i) => ({ ...s, n: fa(String(i + 1).padStart(2, '0')) })),
      faq: D.faq.map((q, i) => ({ ...q, bid: 'sq-b' + i, pid: 'sq-p' + i, open: open === i, icon: open === i ? '−' : '+', toggle: () => this.setState({ open: open === i ? -1 : i }) })),
    };
  }
}
</script>
</body>
</html>
