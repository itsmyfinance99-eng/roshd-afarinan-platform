<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="background:#FFFFFF;border:1px solid #E3E7EF;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;height:100%;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl" style-hover="border-color:#9FB6E6">
  <div role="img" aria-label="جای تصویر دوره" style="aspect-ratio:16/9;background:repeating-linear-gradient(135deg,#EDF3FA 0 10px,#E4ECF6 10px 20px);display:flex;align-items:center;justify-content:center;position:relative">
    <span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#5B667D">کاور دوره</span>
    <span style="position:absolute;top:12px;right:12px;background:#FFFFFF;color:#0E1A33;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;border:1px solid #E3E7EF">{{ priceLabel }}</span>
  </div>
  <div style="padding:20px;display:flex;flex-direction:column;gap:10px;flex:1">
    <span style="font-size:13px;font-weight:700;color:#1450C8">{{ course.category }}</span>
    <h3 style="margin:0;font-size:17px;line-height:1.7;color:#0E1A33;text-wrap:pretty">{{ course.title }}</h3>
    <p style="margin:0;font-size:14px;color:#4A5670">{{ course.instructor }}</p>
    <div style="margin-top:auto;padding-top:14px;border-top:1px solid #EEF1F5;display:flex;gap:16px;font-size:13px;color:#3A4660">
      <span>سطح: {{ course.level }}</span>
      <span>مدت: {{ course.duration }}</span>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;320px&quot;,&quot;height&quot;:&quot;420px&quot;},&quot;course&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;title&quot;:&quot;دوره نمونه&quot;,&quot;category&quot;:&quot;امکان‌سنجی&quot;,&quot;instructor&quot;:&quot;مدرس نمونه&quot;,&quot;level&quot;:&quot;مقدماتی&quot;,&quot;duration&quot;:&quot;۸ ساعت&quot;,&quot;free&quot;:false},&quot;tsType&quot;:&quot;Course&quot;}}">
class Component extends DCLogic {
  renderVals() { const c = this.props.course || {}; return { priceLabel: c.free ? 'رایگان' : 'غیررایگان' }; }
}
</script>
</body>
</html>
