<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="background:#FFFFFF;border:1px solid #E3E7EF;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;height:100%;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl" style-hover="border-color:#9FB6E6">
  <div role="img" aria-label="جای تصویر پروژه" style="position:relative;aspect-ratio:16/9;background:repeating-linear-gradient(135deg,#EEF2F8 0 10px,#E6ECF5 10px 20px);display:flex;align-items:center;justify-content:center">
    <span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#5B667D">تصویر پروژه</span>
    <span style="position:absolute;top:12px;right:12px;background:#FFF4DC;color:#7A4B00;border:1px dashed #D9A441;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px">نمونه نمایشی</span>
  </div>
  <div style="padding:20px;display:flex;flex-direction:column;gap:14px;flex:1">
    <span style="font-size:13px;font-weight:700;color:#1450C8">{{ project.category }}</span>
    <h3 style="margin:0;font-size:17px;line-height:1.7;color:#0E1A33;text-wrap:pretty">{{ project.title }}</h3>
    <dl style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px">
      <dt style="color:#5B667D">موقعیت</dt><dd style="margin:0;color:#1B2740">{{ project.location }}</dd>
      <dt style="color:#5B667D">مرحله</dt><dd style="margin:0;color:#1B2740">{{ project.stage }}</dd>
      <dt style="color:#5B667D">خدمت مورد نیاز</dt><dd style="margin:0;color:#1B2740">{{ project.service }}</dd>
    </dl>
    <a href="Feasibility.dc.html#request" style="margin-top:auto;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #1450C8;color:#1450C8;border-radius:6px;font-size:14px;font-weight:700;text-decoration:none" style-hover="background:#1450C8;color:#FFFFFF">درخواست بررسی</a>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;340px&quot;,&quot;height&quot;:&quot;480px&quot;},&quot;project&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;title&quot;:&quot;طرح نمونه&quot;,&quot;category&quot;:&quot;معدنی&quot;,&quot;location&quot;:&quot;کرمان&quot;,&quot;stage&quot;:&quot;ایده اولیه&quot;,&quot;service&quot;:&quot;امکان‌سنجی&quot;},&quot;tsType&quot;:&quot;Project&quot;}}"></script>
</body>
</html>
