<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="background:#FFFFFF;border:1px solid #E3E7EF;border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:10px;height:100%;box-sizing:border-box;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl" style-hover="border-color:#9FB6E6">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px">
    <span style="font-weight:700;color:#1450C8">{{ item.category }}</span>
    <time style="color:#5B667D">{{ item.date }}</time>
  </div>
  <h3 style="margin:0;font-size:17px;line-height:1.7;color:#0E1A33;text-wrap:pretty">{{ item.title }}</h3>
  <p style="margin:0;font-size:14px;line-height:1.9;color:#4A5670;text-wrap:pretty">{{ item.summary }}</p>
  <a href="{{ href }}" style="margin-top:auto;padding-top:6px;font-size:14px;font-weight:700;color:#1450C8;text-decoration:none" style-hover="color:#0B2257">{{ cta }} ‹</a>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;360px&quot;,&quot;height&quot;:&quot;240px&quot;},&quot;item&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;title&quot;:&quot;عنوان نمونه&quot;,&quot;summary&quot;:&quot;خلاصه کوتاه&quot;,&quot;category&quot;:&quot;دسته&quot;,&quot;date&quot;:&quot;۱۴۰۵/۰۶/۰۱&quot;},&quot;tsType&quot;:&quot;Entry&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;مطالعه&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { href: this.props.href || '#', cta: this.props.cta || 'مطالعه' }; }
}
</script>
</body>
</html>
