<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>فرصت‌های سرمایه‌گذاری — رشدآفرینان صنعت و معدن (نمونه)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&amp;display=swap">
  <script src="mock-data.js"></script>
  <style>html,body{margin:0;background:#FFFFFF;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl}*{box-sizing:border-box}a{color:#1450C8}a:hover{color:#0B2257}:focus-visible{outline:3px solid #0BA5E0;outline-offset:2px}</style>
</helmet>
<div dir="rtl" lang="fa-IR" style="font-family:Vazirmatn,Tahoma,sans-serif;color:#0E1A33;min-height:100vh">
  <dc-import name="SiteHeader" active="investment" hint-size="100%,112px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <main>
    <dc-import name="PageHero" crumb="فرصت‌های سرمایه‌گذاری" eyebrow="فرصت‌های سرمایه‌گذاری" title="معرفی پروژه‌ها و طرح‌ها" lead="در این نسخه، همه پروژه‌ها نمونه نمایشی هستند تا ساختار نمایش و فیلتر فرصت‌ها بررسی شود." hint-size="100%,340px"></dc-import>
    <section style="max-width:1280px;margin:0 auto;padding:48px 24px 80px">
      <div role="note" style="padding:14px 16px;background:#FFF8E8;border:1px solid #EFD9A6;border-radius:6px;font-size:14px;line-height:1.9;color:#5E3C00;margin-bottom:28px">هیچ‌یک از موارد زیر فرصت واقعی یا باز سرمایه‌گذاری نیست. اطلاعات بازده یا عملکرد مالی نمایش داده نمی‌شود.</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;align-items:start">
        <aside aria-label="فیلترها" style="border:1px solid #DDE3EE;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:20px;max-width:100%">
          <div style="display:flex;flex-direction:column;gap:6px">
            <label for="inv-q" style="font-size:14px;font-weight:700;color:#1B2740">جستجو</label>
            <input id="inv-q" value="{{ q }}" onChange="{{ onQ }}" placeholder="عنوان یا استان…" style="height:44px;border:1px solid #C9D2E3;border-radius:6px;padding:0 12px;font:400 14px Vazirmatn,sans-serif">
          </div>
          <fieldset style="border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
            <legend style="font-size:14px;font-weight:700;color:#1B2740;margin-bottom:8px">حوزه</legend>
            <sc-for list="{{ sectorChips }}" as="c" hint-placeholder-count="6">
              <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#1B2740;cursor:pointer;min-height:32px"><input type="radio" name="sector" checked="{{ c.on }}" onChange="{{ c.pick }}" style="width:18px;height:18px;accent-color:#1450C8">{{ c.label }}</label>
            </sc-for>
          </fieldset>
          <div style="display:flex;flex-direction:column;gap:6px">
            <label for="inv-stage" style="font-size:14px;font-weight:700;color:#1B2740">مرحله</label>
            <select id="inv-stage" value="{{ stage }}" onChange="{{ onStage }}" style="height:44px;border:1px solid #C9D2E3;border-radius:6px;padding:0 10px;font:400 14px Vazirmatn,sans-serif;background:#FFFFFF"><sc-for list="{{ stages }}" as="s"><option value="{{ s }}">{{ s }}</option></sc-for></select>
          </div>
          <button type="button" onClick="{{ reset }}" style="height:42px;border:1px solid #C9D2E3;background:#FFFFFF;border-radius:6px;font:600 14px Vazirmatn,sans-serif;color:#1B2740;cursor:pointer">حذف فیلترها</button>
        </aside>
        <div style="grid-column:span 2;min-width:0;display:flex;flex-direction:column;gap:16px">
          <p aria-live="polite" style="margin:0;font-size:14px;color:#4A5670">{{ countLabel }}</p>
          <sc-if value="{{ loading }}">
            <div aria-busy="true" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:20px">
              <sc-for list="{{ skeletons }}" as="k" hint-placeholder-count="4"><div style="height:420px;border-radius:8px;background:#EEF2F7"></div></sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ showEmpty }}">
            <div role="status" style="padding:56px 24px;text-align:center;border:1px dashed #C9D2E3;border-radius:8px">
              <p style="margin:0 0 8px;font-size:18px;font-weight:700">پروژه‌ای یافت نشد</p>
              <p style="margin:0 0 16px;font-size:14px;color:#4A5670">فیلترها را تغییر دهید یا طرح خود را برای امکان‌سنجی ثبت کنید.</p>
              <a href="Feasibility.dc.html#request" style="font-weight:700;text-decoration:none">ثبت پروژه برای امکان‌سنجی ‹</a>
            </div>
          </sc-if>
          <sc-if value="{{ showGrid }}" hint-placeholder-val="{{ true }}">
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:20px">
              <sc-for list="{{ filtered }}" as="p" hint-placeholder-count="6"><dc-import name="ProjectCard" project="{{ p }}" hint-size="100%,460px"></dc-import></sc-for>
            </div>
          </sc-if>
        </div>
      </div>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sector: 'all', stage: 'همه مراحل', q: '', loading: true };
  componentDidMount() {
    this.t = setTimeout(() => this.setState({ loading: false }), 700);
    if (!window.RoshdData) this.poll = setInterval(() => { if (window.RoshdData) { clearInterval(this.poll); this.forceUpdate(); } }, 60);
  }
  componentWillUnmount() { clearInterval(this.poll); clearTimeout(this.t); }
  load(patch) { clearTimeout(this.t); this.setState({ ...patch, loading: true }); this.t = setTimeout(() => this.setState({ loading: false }), 450); }
  renderVals() {
    const D = window.RoshdData || { projects: [], sectors: [] };
    const { sector, stage, q, loading } = this.state;
    const qq = q.trim();
    const filtered = D.projects.filter(p => (sector === 'all' || p.sector === sector) && (stage === 'همه مراحل' || p.stage === stage) && (!qq || p.title.includes(qq) || p.location.includes(qq)));
    const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    return {
      q, onQ: e => this.setState({ q: e.target.value }),
      sectorChips: D.sectors.map(s => ({ ...s, on: s.key === sector, pick: () => this.load({ sector: s.key }) })),
      stages: ['همه مراحل', ...Array.from(new Set(D.projects.map(p => p.stage)))], stage, onStage: e => this.load({ stage: e.target.value }),
      reset: () => this.load({ sector: 'all', stage: 'همه مراحل', q: '' }),
      loading, skeletons: [1, 2, 3, 4], filtered, showEmpty: !loading && !filtered.length, showGrid: !loading && filtered.length > 0,
      countLabel: loading ? 'در حال بارگذاری…' : fa(filtered.length) + ' پروژه نمونه',
    };
  }
}
</script>
</body>
</html>
