name: Spike / decision needed
description: Time-boxed research or a business/legal decision
title: 'spike: '
labels: ['type:spike']
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: '2 days'
