name: Bug report
description: Something is broken
title: 'bug: '
labels: ['type:bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ['critical', 'high', 'medium', 'low']
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Affected module / page
  - type: textarea
    id: env
    attributes:
      label: Environment (browser, device, commit)
