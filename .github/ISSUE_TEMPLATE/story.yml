name: User Story
description: A user-facing increment that fits in one sprint
title: '[ST-XX.YY] '
labels: ['type:story']
body:
  - type: input
    id: epic
    attributes:
      label: Epic
      placeholder: '#12'
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      value: 'به‌عنوان ... می‌خواهم ... تا ...'
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Story points
      options: ['1', '2', '3', '5', '8', '13']
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ['critical', 'high', 'medium', 'low']
    validations:
      required: true
