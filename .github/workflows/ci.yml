# Actions are pinned to commit SHAs (ST-26.10, finding I-11): a moving major tag lets a
# compromised or rewritten release run with our repository token. The trailing comment is the
# release the SHA belongs to; bump both together.
name: CI

on:
  # All PRs, including stacked PRs whose base is another feature branch
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roshd
          POSTGRES_PASSWORD: roshd_ci_password
          POSTGRES_DB: roshd_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U roshd -d roshd_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://roshd:roshd_ci_password@127.0.0.1:5432/roshd_test
      # CI-only throwaway secret (not used anywhere else)
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      FILE_URL_SECRET: ci-only-file-url-secret-0123456789abcdef0123
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm verify
      - name: Install Playwright Chromium
        run: pnpm --filter @roshd/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roshd
          POSTGRES_PASSWORD: roshd_ci_password
          POSTGRES_DB: roshd_image_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roshd -d roshd_image_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: roshd-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build migration image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: false
          load: true
          tags: roshd-migrate:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      # Both images are pruned of packages the running code never loads (ST-27.06), so they are
      # exercised, not just built: a wrong entry in the prune list has to fail here.
      - name: Migrate and seed a fresh database
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://roshd:roshd_ci_password@127.0.0.1:5432/roshd_image_ci \
            roshd-migrate:ci
      - name: Start the API image and check readiness
        run: |
          docker run -d --name api-ci --network host \
            -e DATABASE_URL=postgresql://roshd:roshd_ci_password@127.0.0.1:5432/roshd_image_ci \
            -e JWT_ACCESS_SECRET=ci-only-secret-0123456789abcdef0123456789abcdef \
            -e FILE_URL_SECRET=ci-only-file-url-secret-0123456789abcdef0123 \
            -e WEB_BASE_URL=http://127.0.0.1:3000 \
            roshd-api:ci
          for i in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:4000/api/v1/health/ready || true)
            case "$body" in *'"database":"up"'*) echo "$body"; exit 0;; esac
            sleep 2
          done
          echo "the API image never became ready"; docker logs api-ci; exit 1
      - name: Report image sizes
        if: always()
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep ':ci'
      - name: Stop the API container
        if: always()
        run: docker rm -f api-ci || true
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: roshd-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  commitlint:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
