version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Major upgrades go through a dedicated story (see ADR-0001)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: 'ci(deps)'
